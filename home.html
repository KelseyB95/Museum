    <main>
      <!-- Banner -->
      <div style="position: relative">

            color: white;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
          "

        </div>

      <!-- Search -->

        <h2>Find a museum near you!</h2>
        <form

            flex-wrap: wrap;
            max-width: 800px;
            margin: 1.5rem auto;
          "

          </div>
          <div class="State">
            <h4 style="margin-bottom: 0.5rem">State</h4>
            <input
              type="text"
              id="state"
              placeholder="State"
              style="padding: 12px; width: 180px"
            />
          </div>
          <div class="ZIP">
            <h4 style="margin-bottom: 0.5rem">ZIP Code</h4>
            <input
              type="text"
              id="zip"
              placeholder="ZIP Code"
              style="padding: 12px; width: 180px"
            />
          </div>
          <button
            id="search-button"
            type="submit"
            style="
              padding: 12px 30px;
              background: white;
              color: black;
              border: none;
              cursor: pointer;
            "
          >
            Search
          </button>
        </form>
        <div id="search-result" class="search-result" aria-live="polite"></div>
      </div>

      <!-- Favorites -->
      <section id="Favorites-section" class="fave">
        <div class="Favorites" style="padding: 2rem">

          </p>
          <div id="favorites-grid" class="museums-grid">
            <!--Populated by JavaScript-->
          </div>
        </div>
      </section>
    </main>

      function getFavorites() {
        const savedFavorites = JSON.parse(localStorage.getItem(favoritesKey)) || [];
        return savedFavorites.filter(
          (favorite) => favorite && typeof favorite === "object" && favorite.id,
        );
      }

      function getMuseumId(museum) {
        return `${museum.Name || ""}-${museum.Address || ""}`
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .toLowerCase()
          .replace(/\s+/g, "-");
      }

      function loadMuseums() {
        if (!museumsDataPromise) {
          museumsDataPromise = fetch("museums.csv")
            .then((response) => response.text())
            .then(
              (csv) =>
                new Promise((resolve) => {
                  Papa.parse(csv, {
                    header: true,
                    skipEmptyLines: true,
                    complete: (results) => resolve(results.data),
                  });
                }),
            );
        }

        return museumsDataPromise;
      }

      function buildSearchQuery() {
        const city = document.getElementById("city").value.trim();
        const state = document.getElementById("state").value.trim();
        const zip = document.getElementById("zip").value.trim();

        return [city, state, zip].filter(Boolean).join(", ");
      }

      function getGeocodeCache() {
        return JSON.parse(localStorage.getItem(geocodeCacheKey)) || {};
      }

      function saveGeocodeCache(cache) {
        localStorage.setItem(geocodeCacheKey, JSON.stringify(cache));
      }

      async function geocodeLocation(query) {
        const cache = getGeocodeCache();
        const cacheId = query.toLowerCase();

        if (cache[cacheId]) {
          return cache[cacheId];
        }

        const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=us&q=${encodeURIComponent(query)}`;
        const response = await fetch(url);
        const results = await response.json();

        if (!results.length) {
          return null;
        }

        const location = {
          lat: Number(results[0].lat),
          lon: Number(results[0].lon),
        };

        cache[cacheId] = location;
        saveGeocodeCache(cache);

        return location;
      }

      function getDistanceInMiles(start, end) {
        const earthRadius = 3958.8;
        const toRadians = (degrees) => degrees * (Math.PI / 180);
        const latDistance = toRadians(end.lat - start.lat);
        const lonDistance = toRadians(end.lon - start.lon);
        const startLat = toRadians(start.lat);
        const endLat = toRadians(end.lat);

        const a =
          Math.sin(latDistance / 2) * Math.sin(latDistance / 2) +
          Math.cos(startLat) *
            Math.cos(endLat) *
            Math.sin(lonDistance / 2) *
            Math.sin(lonDistance / 2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

        return earthRadius * c;
      }

      function getMuseumsByDistance(userLocation, museums) {
        return museums
          .map((museum) => {
            const coordinates = museumCoordinates[getMuseumId(museum)];

            if (!coordinates) {
              return null;
            }

            return {
              id: getMuseumId(museum),
              distance: getDistanceInMiles(userLocation, coordinates),
            };
          })
          .filter(Boolean)
          .sort((first, second) => first.distance - second.distance);
      }

      function setSearchMessage(message) {
        document.getElementById("search-result").innerHTML = `<p>${message}</p>`;
      }

      function renderFavorites() {
        const container = document.getElementById("favorites-grid");
        container.innerHTML = "";

        const favorites = getFavorites();

        if (favorites.length === 0) {
          container.innerHTML =
            '<p style="grid-column: 1/-1; text-align:center;">No favorites yet. Browse museums and click the heart!</p>';
          return;
        }

        favorites.forEach((museum) => {
          const card = document.createElement("div");
          card.className = "museum-card";
          const image =
            museum.image || "https://via.placeholder.com/300x200?text=No+Image";
          card.innerHTML = `
                    <img src="${image}" alt="${museum.name}">
                    <div style="padding: 1rem;">
                        <h3>${museum.name}</h3>
                        <p>${museum.address}</p>
                        <p>${museum.summary}</p>
                    </div>
                `;
          container.appendChild(card);
        });
      }

      async function searchMuseums(event) {
        if (event) {
          event.preventDefault();
        }

        const query = buildSearchQuery();
        const button = document.getElementById("search-button");

        if (!query) {
          setSearchMessage("Enter a city, state, ZIP code, or any combination of those fields.");
          return;
        }

        button.disabled = true;
        button.textContent = "Searching...";
        setSearchMessage("Finding the closest museum...");

        try {
          const [museums, userLocation] = await Promise.all([
            loadMuseums(),
            geocodeLocation(`${query}, USA`),
          ]);

          if (!userLocation) {
            setSearchMessage("I could not find that location. Try adding a state or ZIP code.");
            return;
          }

          const searchResults = getMuseumsByDistance(userLocation, museums);

          if (!searchResults.length) {
            setSearchMessage("No museum locations are available yet.");
            return;
          }

          sessionStorage.setItem(
            "museumSearchResults",
            JSON.stringify({
              query,
              results: searchResults,
            }),
          );
          window.location.href = "museums.html?search=1";
        } catch (error) {
          console.error("Search failed:", error);
          setSearchMessage("Search is unavailable right now. Please try again in a moment.");
        } finally {
          button.disabled = false;
          button.textContent = "Search";
        }
      }

      function setupMobileMenu() {
        const hamburger = document.getElementById("hamburger");
        const navLinks = document.getElementById("nav-links");

        hamburger.addEventListener("click", () => {
          const isOpen = navLinks.classList.toggle("open");
          hamburger.setAttribute("aria-expanded", isOpen.toString());
        });

        navLinks.querySelectorAll("a").forEach((link) => {
          link.addEventListener("click", () => {
            navLinks.classList.remove("open");
            hamburger.setAttribute("aria-expanded", "false");
          });
        });
      }

      // Initialize
      window.onload = () => {
        setupMobileMenu();
        renderFavorites();
        loadMuseums();
      };
    </script>
