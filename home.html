<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Near You - Museums</title>
    <link rel="stylesheet" href="home.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Italiana&family=Jacques+Francois&family=Joan&family=Jost:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Quick additions to match mockup - add to home.css later */
      body {
        font-family: "Jost", system-ui, sans-serif;
        background: #141211;
        color: #ddd;
        margin: 0;
      }
      nav {
        background: #400606;
        padding: 1rem 2rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .logo {
        font-size: 1.8rem;
        color: black;
        font-weight: bold;
      }
      .nav-links {
        list-style: none;
        display: flex;
        gap: 2rem;
      }
      .nav-links a {
        color: white;
        text-decoration: none;
      }
      .banner-image {
        width: 100%;
        height: 400px;
        object-fit: cover;
      }
      .search-section {
        background: #400606;
        padding: 2rem;
        text-align: center;
      }
      .museums-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 2rem;
        padding: 2rem;
      }
      .museum-card {
        background: #1f1f1f;
        border-radius: 8px;
        overflow: hidden;
        transition: 0.3s;
      }
      .museum-card:hover {
        transform: scale(1.05);
      }
      .museum-card img {
        width: 100%;
        height: 200px;
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <nav>
      <a href="home.html" class="logo"><span>Near You</span></a>
      <button class="hamburger" id="hamburger">☰</button>
      <ul class="nav-links" id="nav-links">
        <li><a href="home.html">Home</a></li>
        <li><a href="museums.html">Museums</a></li>
        <li><a href="profile.html">Favorites</a></li>
      </ul>
    </nav>

    <main>
      <!-- Banner -->
      <div style="position: relative">
        <img src="images/flag.jpg" alt="American Flag" class="banner-image" />
        <div
          style="
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
          "
        >
          <h1 style="font-size: 3rem">Discover our American Museums</h1>
        </div>
      </div>

      <!-- Search -->
      <div class="search-section">
        <h2>Find a museum near you!</h2>
        <div
          style="
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            max-width: 800px;
            margin: 1.5rem auto;
          "
        >
          <div class="Town">
            <h4 style="margin-bottom: 0.5rem">Town/City</h4>
            <input
              type="text"
              id="city"
              placeholder="Town/City"
              style="padding: 12px; width: 220px"
            />
          </div>
          <div class="State">
            <h4 style="margin-bottom: 0.5rem">State</h4>
            <input
              type="text"
              id="state"
              placeholder="State"
              style="padding: 12px; width: 180px"
            />
          </div>
          <div class="ZIP">
            <h4 style="margin-bottom: 0.5rem">ZIP Code</h4>
            <input
              type="text"
              id="zip"
              placeholder="ZIP Code"
              style="padding: 12px; width: 180px"
            />
          </div>
          <button
            onclick="searchMuseums()"
            style="
              padding: 12px 30px;
              background: white;
              color: black;
              border: none;
              cursor: pointer;
            "
          >
            Search
          </button>
        </div>
      </div>

      <!-- Favorites -->
      <div class="Favorites" style="padding: 2rem">
        <h2>Favorites</h2>
        <p>
          Save your favorite museums and exhibits to easily access them later.
        </p>
        <div id="favorites-grid" class="museums-grid">
          <!-- Populated by JavaScript -->
        </div>
      </div>
    </main>

    <footer>
      <p>&copy; 2026 Near You Museums. All rights reserved.</p>
    </footer>

    <script>
      // Shared museum data (can move this to a separate data.js later)
      const museums = [
        {
          id: 1,
          name: "National Air & Space Museum",
          location: "Washington, DC",
          img: "https://picsum.photos/id/1015/400/250",
          admission: "Free",
          desc: "Iconic aviation...",
        },
        {
          id: 2,
          name: "The Getty",
          location: "Los Angeles, CA",
          img: "https://picsum.photos/id/1016/400/250",
          admission: "Free",
          desc: "World-class European art...",
        },
        // Add more museums here
      ];

      let favorites = JSON.parse(localStorage.getItem("museumFavs")) || [];

      function renderFavorites() {
        const container = document.getElementById("favorites-grid");
        container.innerHTML = "";

        const favMuseums = museums.filter((m) => favorites.includes(m.id));

        if (favMuseums.length === 0) {
          container.innerHTML =
            '<p style="grid-column: 1/-1; text-align:center;">No favorites yet. Browse museums and click the heart!</p>';
          return;
        }

        favMuseums.forEach((museum) => {
          const card = document.createElement("div");
          card.className = "museum-card";
          card.innerHTML = `
                    <img src="${museum.img}" alt="${museum.name}">
                    <div style="padding: 1rem;">
                        <h3>${museum.name}</h3>
                        <p>${museum.location}</p>
                    </div>
                `;
          card.onclick = () =>
            (window.location.href = `museum.html?id=${museum.id}`);
          container.appendChild(card);
        });
      }

      function searchMuseums() {
        // For now, just go to museums page
        window.location.href = "museums.html";
      }

      // Initialize
      window.onload = renderFavorites;
    </script>
  </body>
</html>
