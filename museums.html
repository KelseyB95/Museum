<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Near You - Museums</title>
    <link rel="stylesheet" href="museums.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Italiana&family=Jacques+Francois&family=Joan&family=Jost:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <nav>
      <a href="home.html" class="logo" aria-label="MuseFinder home">
        <img src="MuseFinder.png" alt="MuseFinder logo" />
      </a>
      <button
        class="hamburger"
        id="hamburger"
        type="button"
        aria-label="Open navigation menu"
        aria-expanded="false"
      >
        ☰
      </button>
      <ul class="nav-links" id="nav-links">
        <li><a href="home.html">Home</a></li>
        <li><a href="museums.html">Museums</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="home.html#Favorites-section">Favorites</a></li>
        <li class="mobile-only-nav">
          <a href="privacy.html">Privacy Policy</a>
        </li>
      </ul>
    </nav>

    <main>
      <!-- Banner -->
      <div style="position: relative">
        <img src="images/banner2.png" alt="Museum Banner" class="banner-2" />
        <div
          style="
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
          "
        >
          <h1 style="font-size: 3rem">Museums</h1>
        </div>
      </div>
      <h2>Museum Directory</h2>
      <div id="directory-message" class="directory-message"></div>
      <div class="cards" id="cards"></div>

      <!-- Modal for museum details -->
      <div class="modal" id="modal">
        <div class="modal-content">
          <button
            class="favorite-button"
            id="favorite-button"
            type="button"
            onclick="toggleFavorite()"
            aria-label="Add to favorites"
            aria-pressed="false"
          >
            ♡
          </button>
          <button class="close-button" onclick="closeModal()">× Close</button>
          <img id="modal-image" class="modal-image" src="" alt="" />
          <h2 id="modal-title"></h2>
          <p id="modal-short"></p>
          <div id="modal-body"></div>
          <h3>Features</h3>
          <ul id="modal-features"></ul>
        </div>
      </div>

      <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

      <script>
        let museums = [];
        let featureKey = {};
        let currentMuseumIndex = null;
        let showingSearchResults = false;
        const favoritesKey = "museumFavs";

        Promise.all([
          fetch("museums.csv").then((r) => r.text()),
          fetch("Key.csv").then((r) => r.text()),
        ])
          .then(([museumsCSV, keyCSV]) => {
            Papa.parse(museumsCSV, {
              header: true,
              skipEmptyLines: true,
              complete: (results) => {
                museums = results.data;
                console.log("Museums loaded:", museums.length);
              },
            });

            Papa.parse(keyCSV, {
              header: false,
              skipEmptyLines: true,
              complete: (results) => {
                results.data.forEach((row) => {
                  if (row.length >= 2) {
                    const code = row[0].toString().trim();
                    const meaning = row[1].trim();
                    if (code && meaning) {
                      featureKey[code] = meaning;
                    }
                  }
                });

                console.log(
                  "✅ Feature Key loaded:",
                  Object.keys(featureKey).length,
                  "items",
                );
                console.log(
                  "First 10 entries:",
                  Object.entries(featureKey).slice(0, 10),
                );

                renderCards();
                renderSearchResults();
                openFavoriteModal();
              },
            });
          })
          .catch((err) => console.error("Fetch error:", err));

        function renderCards(
          museumsToRender = museums,
          isSearchResult = false,
        ) {
          const container = document.getElementById("cards");
          container.innerHTML = museumsToRender.length
            ? ""
            : "<p>No museums found.</p>";

          museumsToRender.forEach((museum, cardIndex) => {
            const index = museums.indexOf(museum);
            const card = document.createElement("div");
            card.className = "museum-card";
            const img = museum.Image
              ? museum.Image
              : "https://via.placeholder.com/300x200?text=No+Image";

            if (cardIndex === 0 && isSearchResult) {
              card.classList.add("closest-museum-card");
            }

            card.innerHTML = `
        <img src="${img}" alt="${museum.Name}" style="width:100%; height:200px; object-fit:cover;">
        <div style="padding:15px;">
          <h3>${museum.Name || "No Name"}</h3>
          <p>${museum.Summary || museum.Desctipion || ""}</p>
        </div>
      `;
            card.onclick = () => showDetails(index);
            container.appendChild(card);
          });
        }

        function getMuseumId(museum) {
          return `${museum.Name || ""}-${museum.Address || ""}`
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .toLowerCase()
            .replace(/\s+/g, "-");
        }

        function normalizeMuseumId(museumId) {
          return museumId
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .toLowerCase();
        }

        function escapeHtml(value) {
          return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
        }

        function renderSearchResults() {
          const searchParams = new URLSearchParams(window.location.search);

          if (!searchParams.has("search")) {
            return;
          }

          const savedResults = sessionStorage.getItem("museumSearchResults");
          sessionStorage.removeItem("museumSearchResults");
          window.history.replaceState({}, "", "museums.html");

          if (!savedResults) {
            return;
          }

          let search;

          try {
            search = JSON.parse(savedResults);
          } catch (error) {
            console.error("Could not read search results:", error);
            return;
          }

          if (!search.results || !Array.isArray(search.results)) {
            return;
          }

          const museumsByDistance = search.results
            .map((result) =>
              museums.find((museum) => getMuseumId(museum) === result.id),
            )
            .filter(Boolean);

          document.getElementById("directory-message").innerHTML = `
      <div class="search-directory-message">
        <strong>Closest museums to ${escapeHtml(search.query)}</strong>
        <span>The first card is your closest match.</span>
      </div>
    `;

          showingSearchResults = true;
          renderCards(museumsByDistance, true);
        }

        function openFavoriteModal() {
          const favoriteMuseumId = new URLSearchParams(
            window.location.search,
          ).get("favorite");

          if (!favoriteMuseumId) {
            return;
          }

          const museumIndex = museums.findIndex(
            (museum) =>
              getMuseumId(museum) === normalizeMuseumId(favoriteMuseumId),
          );

          if (museumIndex >= 0) {
            showDetails(museumIndex);
            window.history.replaceState({}, "", "museums.html");
          }
        }

        function getFavorites() {
          const savedFavorites =
            JSON.parse(localStorage.getItem(favoritesKey)) || [];
          return savedFavorites.filter(
            (favorite) =>
              favorite && typeof favorite === "object" && favorite.id,
          );
        }

        function saveFavorites(favorites) {
          localStorage.setItem(favoritesKey, JSON.stringify(favorites));
        }

        function isFavorite(museum) {
          const museumId = getMuseumId(museum);
          return getFavorites().some((favorite) => favorite.id === museumId);
        }

        function makeFavorite(museum) {
          return {
            id: getMuseumId(museum),
            name: museum.Name || "Museum",
            summary: museum.Summary || museum.Desctipion || "",
            image:
              museum.Image ||
              "https://via.placeholder.com/300x200?text=No+Image",
            admission: museum.Admission || "N/A",
            address: museum.Address || "N/A",
            phone: museum.Phone || "N/A",
          };
        }

        function updateFavoriteButton(museum) {
          const button = document.getElementById("favorite-button");
          const favorite = isFavorite(museum);

          button.classList.toggle("is-favorite", favorite);
          button.textContent = favorite ? "♥" : "♡";
          button.setAttribute(
            "aria-label",
            favorite ? "Remove from favorites" : "Add to favorites",
          );
          button.setAttribute("aria-pressed", favorite.toString());
        }

        function toggleFavorite() {
          if (currentMuseumIndex === null) {
            return;
          }

          const museum = museums[currentMuseumIndex];
          const museumId = getMuseumId(museum);
          const favorites = getFavorites();
          const existingFavorite = favorites.findIndex(
            (favorite) => favorite.id === museumId,
          );

          if (existingFavorite >= 0) {
            favorites.splice(existingFavorite, 1);
          } else {
            favorites.push(makeFavorite(museum));
          }

          saveFavorites(favorites);
          updateFavoriteButton(museum);
        }

        function showDetails(index) {
          currentMuseumIndex = index;
          const m = museums[index];
          const img = m.Image
            ? m.Image
            : "https://via.placeholder.com/300x200?text=No+Image";
          document.getElementById("modal-title").textContent =
            m.Name || "Museum";
          document.getElementById("modal-image").src = img;
          document.getElementById("modal-image").alt = m.Name || "Museum image";

          document.getElementById("modal-short").innerHTML =
            `<p><strong>Description:</strong> ${m.Desctipion || ""}</p>`;

          document.getElementById("modal-body").innerHTML = `
      <p><strong>Admission:</strong> ${m.Admission || "N/A"}</p>
      <p><strong>Address:</strong> ${m.Address || "N/A"}</p>
      <p><strong>Phone:</strong> ${m.Phone || "N/A"}</p>
    `;

          const list = document.getElementById("modal-features");
          list.innerHTML = "";

          if (m.Features) {
            const codes = m.Features.split(",").map((c) => c.trim());
            codes.forEach((code) => {
              const text = featureKey[code] || `Feature ${code} (not in key)`;
              const li = document.createElement("li");
              li.textContent = text;
              list.appendChild(li);
            });
          }

          updateFavoriteButton(m);
          document.getElementById("modal").style.display = "flex";
        }

        function closeModal() {
          document.getElementById("modal").style.display = "none";
        }

        function setupMobileMenu() {
          const hamburger = document.getElementById("hamburger");
          const navLinks = document.getElementById("nav-links");

          hamburger.addEventListener("click", () => {
            const isOpen = navLinks.classList.toggle("open");
            hamburger.setAttribute("aria-expanded", isOpen.toString());
          });

          navLinks.querySelectorAll("a").forEach((link) => {
            link.addEventListener("click", () => {
              navLinks.classList.remove("open");
              hamburger.setAttribute("aria-expanded", "false");
            });
          });
        }

        window.addEventListener("pageshow", (event) => {
          if (event.persisted && showingSearchResults) {
            window.location.reload();
          }
        });

        setupMobileMenu();
      </script>
    </main>
    <footer>
      <p>&copy; 2026 MuseFinder. All rights reserved.</p>
      <p><a href="privacy.html">Privacy Policy</a></p>
    </footer>
  </body>
</html>
